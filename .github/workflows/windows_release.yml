
name: Windows release

on:
    release:
      types:
        - created

jobs:
    windows:
        name: Release
        runs-on: windows-latest
        permissions:
          id-token: write     # Required for OIDC token exchange
        env:
            RUNNER_OS: "windows"
            CI: "1"
        steps:
            - name: Checkout branch
              uses: actions/checkout@v6
            - name: Install miniconda
              uses: conda-incubator/setup-miniconda@v4
              with:
                auto-update-conda: true
                miniforge-version: latest
                activate-environment: test
                # channels: conda-forge,defaults
                # Only used to create a conda env from which to pull
                # winpty; nothing here runs Python. 3.9 has been EOL
                # since 2025-10, so it is pinned forward to keep the
                # release job from depending on conda-forge continuing
                # to serve an unsupported interpreter.
                python-version: "3.12"
            - uses: nuget/setup-nuget@v4
              with:
                nuget-version: '5.x'
            - name: Conda env info
              shell: bash -l {0}
              run: conda env list
            - name: Install winpty
              shell: bash -l {0}
              run: conda install -y winpty
            - name: Cargo build
              shell: bash -l {0}
              run: cargo build -vv --features conpty --features winpty
            - uses: rust-lang/crates-io-auth-action@v1
              id: auth
            - run: cargo publish --allow-dirty
              env:
                CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
